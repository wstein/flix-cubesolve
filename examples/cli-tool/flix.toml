[package]
name        = "cubesolve"
description = "Demo command line for cubesolve: solve, scramble, draw and identify NxNxN cubes"
version     = "0.1.0"
repository  = "github:wstein/flix-cubesolve"
flix        = "0.75.3"
license     = "AGPL-3.0-or-later"
authors     = ["Werner Stein"]

[dependencies]
# unrestricted: CubeSolve.Model.Random.secureSeed uses java.security.SecureRandom
# directly, which the default "plain" security context forbids for a dependency.
# This is the sibling package this example exists to prove works, not a
# third-party unknown, so granting it is the deliberate choice here.
"github:wstein/flix-cubesolve" = { version = "0.3.0", security = "unrestricted" }

[mvn-dependencies]
"com.google.zxing:core" = "3.5.4"
"com.google.zxing:javase" = "3.5.4"
