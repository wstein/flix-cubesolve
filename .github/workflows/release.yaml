name: Release

# A tag is the only thing that publishes. Pushing `v1.2.3` builds the package
# from that exact tag, checks it, and attaches it to a GitHub release of the
# same name -- so what a consumer downloads is what this repository built from
# the commit the tag names, rather than whatever was on a maintainer's laptop.
#
# `github:` dependencies resolve through release assets, so a tag without a
# release is a version nobody can depend on. That is what this closes.

on:
  push:
    tags: ['v*.*.*']

# Read-only by default, exactly as the other workflows are. Only the one job
# that has to publish gets more, and it says so where it asks.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a run killed between creating the release and uploading the
  # package leaves a release with nothing in it, which reads as a published
  # version and resolves as a missing one.
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # A wedged runner is not a build failure, but without a cap it looks like
    # one for six hours: GitHub's default.
    #
    # 15 was set when this job took about a minute, on the reasoning that
    # anything near the cap was a hung runner rather than slow work. That stopped
    # being true when the library gained two whole-cube methods: their tests
    # solve real cubes and build real tables, and the `Test` step below runs the
    # whole suite. v0.4.0 was killed here at 15m00s with the suite still running
    # and nothing published -- a green tree reported as a failed release.
    #
    # 45 is the cap for the work this job actually does now. The suite is four
    # to five minutes locally and three times that on a shared runner, so this
    # is still comfortably below "hung" while leaving room for a slow runner.
    timeout-minutes: 45

    permissions:
      contents: write # create the release and upload the package to it

    steps:
      # A tag push checks out the tag, so everything below is built from the
      # commit the tag names and not from the branch it happens to sit on.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flixw is itself a Java program, so it needs one JDK to start; from there
      # it fetches the compiler pinned in .flixw/lock.toml and verifies it
      # against the committed digest before running it. 21 is the lowest Java
      # the wrapper supports, so this runs on the oldest JDK this project claims.
      - name: Install JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Shared with Build and Test, and safe for the same reason: the digest in
      # the lock is re-verified on every run, so a restored -- or tampered --
      # cache cannot substitute a different compiler, only save a download.
      - name: Restore the pinned compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flixw
          key: ${{ runner.os }}-flixw-${{ hashFiles('.flixw/lock.toml') }}

      # The tag is what a consumer writes in their own flix.toml, and the
      # version inside the package is what the resolver reads back. If those
      # two disagree the release is mislabelled in a way nothing downstream can
      # see, so refuse before anything is published rather than after.
      - name: The tag names the version this tree declares
        run: |
          set -euo pipefail
          tagged=${GITHUB_REF_NAME#v}
          declared=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' flix.toml)
          if [ "$tagged" != "$declared" ]; then
            echo "::error file=flix.toml::tag ${GITHUB_REF_NAME} would publish" \
                 "version ${declared}; flix.toml has to say ${tagged}"
            exit 1
          fi
          echo "ok  ${GITHUB_REF_NAME} publishes ${declared}"

      # Wrapper integrity first: the shims match the committed stage 0, the lock
      # satisfies flix.toml, and every generated file is tracked by git. A
      # failure here means the rest of the run would prove nothing.
      - name: Validate the wrapper
        run: ./flixw validate

      # The fast subset only -- about a minute. The whole suite is seventeen,
      # and running it here put twenty-three minutes between a tag and anything
      # anyone could install, which is too long to leave a release in the air.
      #
      # The full suite still runs against exactly this artefact, in `full-suite`
      # below, and the release stays a prerelease until it passes. So nothing is
      # skipped -- it is reordered, and the reordering is what lets the package
      # exist while the long gate runs.
      - name: Test (fast subset)
        run: ./flixw test
        env:
          CUBESOLVE_FAST: '1'

      - name: Package
        run: ./flixw build-pkg

      # `flix.toml` goes up alongside the package because the resolver fetches
      # both: it reads the manifest to learn what the package needs before it
      # downloads the package itself. A release carrying only the `.fpkg` looks
      # complete and still fails to resolve.
      # Published as a prerelease, and promoted by `promote` once the full
      # suite and the example have both passed against it. A `github:`
      # dependency resolves a prerelease by exact version, so anyone who names
      # this version can already have it; what the flag withholds is "latest",
      # which is the recommendation rather than the artefact.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            artifact/flix-cubesolve.fpkg \
            artifact/flix.toml
          echo "published ${GITHUB_REF_NAME} as a prerelease; the full suite decides whether it is promoted"

  # The library is qualified before the tag; this is the half that cannot be.
  #
  # `examples/cli-tool` is a separate package that resolves `cubesolve` through
  # release assets rather than through the working tree, which is what makes it
  # an honest consumer -- it sees only the public surface, under Flix's
  # dependency security context, exactly as anyone else's project would. The
  # price is that a source change cannot compile it until the version it pins
  # exists, so this runs after the publish above and not before.
  #
  # It has already earned its place: qualifying 0.3.0 by hand caught a call left
  # at the old arity, an assertion on output text that had been replaced, and an
  # assertion on refusal wording that moved when OLL and PLL began sharing it.
  # None of those are visible to any gate that builds the library alone.
  #
  # **A failure here means the release is already published and wrong.** There is
  # no undoing it -- a version anyone may have resolved must not change under
  # them -- so the fix is a corrective patch release, not a retag.
  qualify-example:
    name: Qualify the example against ${{ github.ref_name }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # The pin has to name the version just published, or this job would
      # cheerfully qualify the previous release and report success.
      - name: The example pins the version being released
        run: |
          set -euo pipefail
          released=${GITHUB_REF_NAME#v}
          pinned=$(sed -nE 's/.*flix-cubesolve"[^"]*version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' \
            examples/cli-tool/flix.toml)
          if [ "$pinned" != "$released" ]; then
            echo "::error file=examples/cli-tool/flix.toml::the example pins" \
                 "${pinned}, but ${GITHUB_REF_NAME} publishes ${released}"
            exit 1
          fi
          echo "ok  the example pins ${pinned}"

      # Resolution is a real check, not setup: a release whose assets are
      # missing or malformed fails here rather than on a user's machine.
      - name: Resolve and test the example
        shell: bash
        run: |
          set -euo pipefail
          rm -rf examples/cli-tool/lib
          ./flixw examples test cli-tool 2>&1 | tee /tmp/example.log
          # The compiler colours its summary, so "Passed:" is followed by an
          # escape sequence rather than by the digit. Strip escapes before
          # matching: this guard once rejected a run of 21 passing tests, and
          # failed the release that those tests had just qualified.
          if ! sed $'s/\033\[[0-9;]*m//g' /tmp/example.log | grep -qE "^Passed: [0-9]+"; then
            echo "::error::the example reported no test results -- it ran nothing"
            exit 1
          fi

      - name: Say what a failure here means
        if: failure()
        run: |
          echo "::error::${GITHUB_REF_NAME} is published and the example does not" \
               "build against it. A published version must not change under" \
               "anyone who has resolved it, so fix forward with a corrective" \
               "patch release rather than retagging."

  # The long gate, moved off the path between a tag and a package.
  #
  # This runs the whole suite -- every pattern included -- against the commit
  # the tag names, which is the same source the artefact above was built from.
  # It takes about twenty minutes, and until it passes the release stays a
  # prerelease.
  full-suite:
    name: The whole suite against ${{ github.ref_name }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # No CUBESOLVE_FAST, and CUBESOLVE_EXHAUSTIVE on: everything the project
      # has. This is the gate the fast subset in `release` is a subset of.
      - name: Test, including every pattern
        run: ./flixw test
        env:
          CUBESOLVE_EXHAUSTIVE: '1'

      - name: Race two processes onto one cache
        run: ./scripts/qualify-cache-race.sh
        env:
          CUBESOLVE_RACE_ROUNDS: '5'

  # Prerelease to latest, and only with both gates green.
  #
  # Separate from the jobs it waits on so that "is this version recommended" is
  # one decision in one place, rather than something each gate might do half of.
  promote:
    name: Promote ${{ github.ref_name }} to latest
    needs: [full-suite, qualify-example]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
          echo "${GITHUB_REF_NAME} is now the latest release"

      # A prerelease that never got promoted is the failure mode worth naming:
      # it is installable by exact version and is not recommended, which is
      # correct but easy to miss if nobody says it out loud.
      - name: Say what a failure here means
        if: failure()
        run: |
          echo "::error::${GITHUB_REF_NAME} stays a prerelease. It is published" \
               "and resolvable by exact version, but it is not recommended and" \
               "not 'latest'. Fix forward with a corrective patch release; do" \
               "not retag a published version."
